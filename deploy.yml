---
- hosts: all
  become: true
  vars:
    redmine_image: redmine:latest
    redmine_container_name: redmine
    redmine_data_dir: /opt/redmine
    redmine_env_file: "{{ redmine_data_dir }}/.env"
  tasks:
    - name: Install community.docker collection (if not present)
      ansible.builtin.command: ansible-galaxy collection install community.docker
      ignore_errors: true
      changed_when: false

    - name: Create directory for Redmine data and env file
      file:
        path: "{{ redmine_data_dir }}"
        state: directory
        mode: '0755'

    - name: Template .env file for Redmine
      template:
        src: templates/.env.j2
        dest: "{{ redmine_env_file }}"
        mode: '0644'

    - name: Ensure Redmine container is stopped and removed (if exists)
      community.docker.docker_container:
        name: "{{ redmine_container_name }}"
        state: absent

    - name: Run Redmine container with MySQL connection
      community.docker.docker_container:
        name: "{{ redmine_container_name }}"
        image: "{{ redmine_image }}"
        restart: yes
        ports:
          - "{{ redmine_port }}:3000"
        env:
          REDMINE_DB_MYSQL: "{{ db_name }}"
          REDMINE_DB_USERNAME: "{{ db_user }}"
          REDMINE_DB_PASSWORD: "{{ db_password }}"
          REDMINE_DB_HOST: "{{ db_host }}"
        volumes:
          - "{{ redmine_data_dir }}/data:/usr/src/redmine/files"
